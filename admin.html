<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>芒芒简餐 · 后台管理</title>
  <style>
    :root {
      --bg: #1A1A1A; --bg2: #222222; --bg3: #2C2C2C;
      --fg: rgba(255,255,255,0.9); --fg2: rgba(255,255,255,0.5);
      --mango: #FFA726; --mango2: #FF9800; --mango3: #F57C00;
      --green: #66BB6A; --red: #EF5350; --sep: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column;
    }
    .pwd-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 9999;
      display: flex; justify-content: center; align-items: center; padding: 24px;
    }
    .pwd-overlay.hidden { display: none; }
    .pwd-box {
      background: var(--bg2); border-radius: 16px; padding: 32px 24px;
      width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 20px;
    }
    .pwd-icon { font-size: 48px; }
    .pwd-title { font-size: 20px; font-weight: 600; color: var(--mango); }
    .pwd-input {
      padding: 14px; border: 1.5px solid var(--sep); border-radius: 10px;
      font-size: 16px; background: var(--bg3); color: var(--fg);
      outline: none; text-align: center; letter-spacing: 4px; font-family: inherit;
    }
    .pwd-input:focus { border-color: var(--mango); }
    .pwd-btn {
      background: var(--mango2); color: #1A1A1A; border: none;
      padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .pwd-error { color: var(--red); font-size: 13px; min-height: 20px; }
    .nav {
      background: var(--bg2); height: 44px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; border-bottom: 0.5px solid var(--sep); flex-shrink: 0;
    }
    .nav-back { background: none; border: none; color: var(--mango); font-size: 15px; cursor: pointer; font-family: inherit; }
    .nav-title { font-size: 17px; font-weight: 500; }
    .content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .stats { display: flex; gap: 10px; }
    .stat { flex: 1; background: var(--bg2); border-radius: 10px; padding: 14px 10px; text-align: center; }
    .stat-num { font-size: 20px; font-weight: 700; color: var(--mango); }
    .stat-label { font-size: 11px; color: var(--fg2); margin-top: 4px; }
    .card { background: var(--bg2); border-radius: 12px; padding: 16px; }
    .card h3 { font-size: 15px; margin-bottom: 14px; color: var(--mango); }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-group label { font-size: 12px; color: var(--fg2); }
    .form-group input, .form-group select {
      padding: 11px 14px; border: 1px solid var(--sep); border-radius: 8px;
      font-size: 15px; background: var(--bg3); color: var(--fg); outline: none; font-family: inherit;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 13px;
      cursor: pointer; border: none; font-family: inherit;
    }
    .btn-pri { background: var(--mango2); color: #1A1A1A; flex: 1; }
    .btn-out { background: transparent; color: var(--mango); border: 1.5px solid var(--mango); }
    .btn-danger { background: var(--red); color: white; }
    .btn-success { background: var(--green); color: white; }
    .list-item {
      display: flex; align-items: center; padding: 14px 0; border-bottom: 0.5px solid var(--sep); gap: 12px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-emoji {
      font-size: 28px; background: var(--bg3); border-radius: 8px;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .list-info { flex: 1; min-width: 0; }
    .list-name { font-size: 15px; font-weight: 500; }
    .list-meta { font-size: 12px; color: var(--fg2); margin-top: 2px; }
    .list-price { font-weight: 600; color: var(--mango); margin-right: 6px; white-space: nowrap; }
    .mini-btn {
      padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      cursor: pointer; border: none; font-family: inherit;
    }
    .mini-edit { background: rgba(255,167,38,0.15); color: var(--mango); }
    .mini-del { background: rgba(239,83,80,0.15); color: var(--red); }
    .sync-status { font-size: 11px; padding: 4px 10px; border-radius: 8px; }
    .sync-status.synced { background: rgba(102,187,106,0.2); color: var(--green); }
    .sync-status.syncing { background: rgba(255,167,38,0.2); color: var(--mango); }
    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 10px 22px; border-radius: 8px;
      font-size: 14px; z-index: 2000; pointer-events: none;
      animation: toastAnim 1.8s forwards;
    }
    @keyframes toastAnim {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      85% { opacity: 1; } 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="pwd-overlay" id="pwdOverlay">
    <div class="pwd-box">
      <div class="pwd-icon">🔐</div>
      <div class="pwd-title">后台管理验证</div>
      <input type="password" class="pwd-input" id="pwdInput" placeholder="请输入管理密码" maxlength="30" autocomplete="off">
      <div class="pwd-error" id="pwdError"></div>
      <button class="pwd-btn" id="pwdBtn">验证进入</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-back" onclick="window.open('index.html','_self')">← 首页</button>
    <div class="nav-title">⚙️ 菜单管理 <span class="sync-status synced" id="syncStatus">✅ 已同步</span></div>
    <div style="width:50px;"></div>
  </div>
  <div class="content">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">菜品总数</div></div>
      <div class="stat"><div class="stat-num" id="catCount">0</div><div class="stat-label">分类数</div></div>
      <div class="stat"><div class="stat-num" id="avgPrice">¥0</div><div class="stat-label">均价</div></div>
    </div>

    <div class="card">
      <h3 id="formTitle">➕ 添加菜品</h3>
      <input type="hidden" id="editId">
      <div class="form-group"><label>菜品名称</label><input id="pName" placeholder="例：招牌芒果绵绵冰"></div>
      <div class="form-group"><label>分类</label><select id="pCat"><option>芒果甜品</option><option>芒果饮品</option><option>芒果简餐</option><option>小食</option></select></div>
      <div class="form-group"><label>价格 (元)</label><input id="pPrice" type="number" placeholder="28.0" step="0.01" min="0"></div>
      <div class="form-group"><label>表情图标</label><input id="pEmoji" placeholder="🍧" maxlength="4"></div>
      <div class="btn-row">
        <button class="btn btn-pri" id="btnAdd">添加菜品</button>
        <button class="btn btn-pri" id="btnUpdate" style="display:none;">保存修改</button>
        <button class="btn btn-out" id="btnCancel" style="display:none;">取消</button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-success" id="btnSync">🔄 手动同步到云端</button>
        <button class="btn btn-out" id="btnReset">恢复默认</button>
        <button class="btn btn-danger" id="btnClear">清空全部</button>
      </div>
    </div>

    <div class="card" id="listContainer"><div style="text-align:center;padding:40px;color:var(--fg2);">加载中...</div></div>
  </div>

  <script>
    (function() {
      // 配置
      const GITHUB_USER = 'yuxiaojiededian';
      const GITHUB_REPO = 'youdianmang';
      const PWD_URL = 'password.txt';
      const CONFIG_URL = 'config.txt';
      const MENU_FILE = 'menu.json';
      
      const defaults = [
        { id:'1', name:'招牌芒果绵绵冰', cat:'芒果甜品', price:'28.0', emoji:'🍧' },
        { id:'2', name:'芒果椰奶西米露', cat:'芒果甜品', price:'22.0', emoji:'🥥' },
        { id:'3', name:'芒果班戟', cat:'芒果甜品', price:'18.0', emoji:'🥞' },
        { id:'4', name:'芒果双皮奶', cat:'芒果甜品', price:'16.0', emoji:'🍮' },
        { id:'5', name:'芒果冰沙', cat:'芒果饮品', price:'20.0', emoji:'🥤' },
        { id:'6', name:'芒果乳酸菌', cat:'芒果饮品', price:'18.0', emoji:'🧃' },
        { id:'7', name:'芒果糯米饭', cat:'芒果简餐', price:'26.0', emoji:'🍚' },
        { id:'8', name:'芒果鲜虾沙拉', cat:'芒果简餐', price:'32.0', emoji:'🥗' },
        { id:'9', name:'炸薯条', cat:'小食', price:'12.0', emoji:'🍟' },
        { id:'10', name:'鸡米花', cat:'小食', price:'15.0', emoji:'🍗' }
      ];

      let githubToken = '';

      // 密码验证
      const pwdOverlay = document.getElementById('pwdOverlay');
      const pwdInput = document.getElementById('pwdInput');
      const pwdBtn = document.getElementById('pwdBtn');
      const pwdError = document.getElementById('pwdError');
      let correctPwd = '';

      async function initPwd() {
        try {
          const r = await fetch(PWD_URL);
          if (r.ok) correctPwd = (await r.text()).trim();
        } catch(e) {}
      }

      pwdBtn.addEventListener('click', () => {
        if (pwdInput.value.trim() === correctPwd) {
          pwdOverlay.classList.add('hidden');
          loadToken().then(() => initAdmin());
        } else {
          pwdError.textContent = '密码错误';
          pwdInput.value = '';
        }
      });
      pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwdBtn.click(); });
      initPwd().then(() => pwdInput.focus());

      // 加载Token
      async function loadToken() {
        try {
          const r = await fetch(CONFIG_URL);
          if (r.ok) {
            const encoded = (await r.text()).trim();
            githubToken = atob(encoded);
          }
        } catch(e) {}
      }

      // 上传到GitHub
      async function uploadToGitHub(filename, content, message) {
        if (!githubToken) { toast('Token未加载'); return false; }
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filename}`;
        try {
          // 先获取文件SHA
          let sha = '';
          try {
            const getResp = await fetch(url, { headers: { Authorization: `token ${githubToken}` } });
            if (getResp.ok) {
              const data = await getResp.json();
              sha = data.sha;
            }
          } catch(e) {}

          const body = {
            message: message,
            content: btoa(unescape(encodeURIComponent(content))),
          };
          if (sha) body.sha = sha;

          const resp = await fetch(url, {
            method: 'PUT',
            headers: {
              Authorization: `token ${githubToken}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(body),
          });
          return resp.ok;
        } catch(e) {
          return false;
        }
      }

      function initAdmin() {
        function load() {
          const s = localStorage.getItem('mango_menu');
          if (s) { try { return JSON.parse(s); } catch(e) {} }
          localStorage.setItem('mango_menu', JSON.stringify(defaults));
          return [...defaults];
        }
        function save(p) { localStorage.setItem('mango_menu', JSON.stringify(p)); }
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,6); }

        const nEl = document.getElementById('pName'), cEl = document.getElementById('pCat');
        const pEl = document.getElementById('pPrice'), eEl = document.getElementById('pEmoji');
        const editId = document.getElementById('editId'), fTitle = document.getElementById('formTitle');
        const btnAdd = document.getElementById('btnAdd'), btnUp = document.getElementById('btnUpdate');
        const btnCancel = document.getElementById('btnCancel'), listC = document.getElementById('listContainer');
        const syncStatus = document.getElementById('syncStatus');

        function resetForm() {
          nEl.value = ''; pEl.value = ''; eEl.value = ''; cEl.value = '芒果甜品'; editId.value = '';
          fTitle.textContent = '➕ 添加菜品';
          btnAdd.style.display = ''; btnUp.style.display = 'none'; btnCancel.style.display = 'none';
        }

        function editProd(p) {
          nEl.value = p.name; cEl.value = p.cat; pEl.value = p.price; eEl.value = p.emoji || '';
          editId.value = p.id; fTitle.textContent = '✏️ 编辑菜品';
          btnAdd.style.display = 'none'; btnUp.style.display = ''; btnCancel.style.display = '';
        }

        function updateStats(prods) {
          document.getElementById('totalCount').textContent = prods.length;
          document.getElementById('catCount').textContent = new Set(prods.map(p => p.cat)).size;
          const avg = prods.length ? (prods.reduce((s,p) => s + parseFloat(p.price||0),0) / prods.length).toFixed(1) : '0';
          document.getElementById('avgPrice').textContent = '¥' + avg;
        }

        async function syncToCloud(prods) {
          syncStatus.textContent = '⏳ 同步中...';
          syncStatus.className = 'sync-status syncing';
          const success = await uploadToGitHub(MENU_FILE, JSON.stringify(prods), '更新菜单');
          if (success) {
            syncStatus.textContent = '✅ 已同步';
            syncStatus.className = 'sync-status synced';
            toast('✅ 菜单已同步到云端');
          } else {
            syncStatus.textContent = '❌ 同步失败';
            syncStatus.className = 'sync-status';
            toast('❌ 同步失败，请检查Token');
          }
        }

        function renderList() {
          const prods = load();
          if (prods.length === 0) {
            listC.innerHTML = '<div style="text-align:center;padding:40px;color:var(--fg2);">🥭 暂无菜品</div>';
          } else {
            listC.innerHTML = prods.map(p => `
              <div class="list-item">
                <div class="list-emoji">${p.emoji||'🥭'}</div>
                <div class="list-info"><div class="list-name">${p.name}</div><div class="list-meta">${p.cat}</div></div>
                <div class="list-price">¥${parseFloat(p.price).toFixed(2)}</div>
                <div class="list-actions">
                  <button class="mini-btn mini-edit" data-id="${p.id}">编辑</button>
                  <button class="mini-btn mini-del" data-id="${p.id}">删除</button>
                </div>
              </div>
            `).join('');
            listC.querySelectorAll('.mini-edit').forEach(b => b.addEventListener('click', () => {
              const p = prods.find(x => x.id === b.dataset.id); if (p) editProd(p);
            }));
            listC.querySelectorAll('.mini-del').forEach(b => b.addEventListener('click', () => {
              if (confirm('确定删除？')) { const updated = prods.filter(x => x.id !== b.dataset.id); save(updated); renderList(); syncToCloud(updated); }
            }));
          }
          updateStats(prods);
        }

        btnAdd.addEventListener('click', () => {
          const name = nEl.value.trim(); if (!name) { toast('请输入名称'); return; }
          const price = parseFloat(pEl.value); if (isNaN(price) || price < 0) { toast('请输入有效价格'); return; }
          const prods = load();
          prods.push({ id: genId(), name, cat: cEl.value, price: price.toFixed(2), emoji: eEl.value || '🥭' });
          save(prods); resetForm(); renderList(); syncToCloud(prods);
        });

        btnUp.addEventListener('click', () => {
          const name = nEl.value.trim(); if (!name) { toast('请输入名称'); return; }
          const price = parseFloat(pEl.value); if (isNaN(price) || price < 0) { toast('请输入有效价格'); return; }
          const prods = load(); const idx = prods.findIndex(p => p.id === editId.value);
          if (idx > -1) {
            prods[idx] = { ...prods[idx], name, cat: cEl.value, price: price.toFixed(2), emoji: eEl.value || '🥭' };
            save(prods); resetForm(); renderList(); syncToCloud(prods);
          }
        });

        btnCancel.addEventListener('click', resetForm);
        document.getElementById('btnSync').addEventListener('click', () => syncToCloud(load()));
        document.getElementById('btnReset').addEventListener('click', () => {
          if (confirm('恢复默认菜单？')) { save([...defaults]); renderList(); syncToCloud([...defaults]); }
        });
        document.getElementById('btnClear').addEventListener('click', () => {
          if (confirm('清空全部？')) { save([]); renderList(); syncToCloud([]); }
        });

        function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
        renderList();
      }
    })();
  </script>
</body>
</html>
