<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>芒芒简餐 · 商户扫码核销</title>
  <style>
    :root {
      --bg: #1A1A1A;
      --bg2: #222222;
      --bg3: #2C2C2C;
      --fg: rgba(255,255,255,0.9);
      --fg2: rgba(255,255,255,0.5);
      --fg3: rgba(255,255,255,0.3);
      --mango: #FFA726;
      --mango2: #FF9800;
      --mango3: #F57C00;
      --green: #66BB6A;
      --red: #EF5350;
      --sep: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }

    /* 导航栏 */
    .nav {
      background: var(--bg2);
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 0.5px solid var(--sep);
      flex-shrink: 0;
    }

    .nav-back {
      background: none;
      border: none;
      color: var(--mango);
      font-size: 15px;
      cursor: pointer;
      padding: 6px 0;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-status {
      width: 60px;
      text-align: right;
      font-size: 11px;
      color: var(--fg2);
    }

    /* 内容区 */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
      overflow-y: auto;
    }

    /* 商户信息卡 */
    .merchant-card {
      background: var(--bg2);
      border-radius: 14px;
      padding: 16px 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--sep);
    }

    .merchant-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--mango), var(--mango3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .merchant-info {
      flex: 1;
      min-width: 0;
    }

    .merchant-name {
      font-size: 15px;
      font-weight: 600;
    }

    .merchant-id {
      font-size: 11px;
      color: var(--fg2);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .merchant-badge {
      background: rgba(102,187,106,0.2);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .merchant-badge.offline {
      background: rgba(239,83,80,0.2);
      color: var(--red);
    }

    /* 扫码区域 */
    .scanner-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scanner-box {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg2);
      border-radius: 16px;
      border: 2px solid var(--sep);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanner-box.scanning {
      border-color: var(--mango);
      box-shadow: 0 0 20px rgba(255,167,38,0.2);
    }

    .scanner-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--fg2);
      background: var(--bg2);
    }

    .scanner-placeholder.hidden {
      display: none;
    }

    .placeholder-icon {
      font-size: 56px;
      opacity: 0.6;
    }

    .placeholder-text {
      font-size: 14px;
    }

    .placeholder-hint {
      font-size: 11px;
      color: var(--fg3);
    }

    /* 扫描线动画 */
    .scan-line {
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 2px;
      background: var(--mango);
      box-shadow: 0 0 8px var(--mango);
      animation: scanLine 2s linear infinite;
      display: none;
    }

    .scanner-box.scanning .scan-line {
      display: block;
    }

    @keyframes scanLine {
      0% { top: 10%; }
      50% { top: 90%; }
      100% { top: 10%; }
    }

    /* 按钮 */
    .btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 16px 20px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--mango2);
      color: #1A1A1A;
    }

    .btn-primary:disabled {
      background: #444;
      color: #888;
    }

    .btn-secondary {
      background: var(--bg2);
      color: var(--fg);
      border: 1.5px solid var(--sep);
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    /* 结果弹窗 */
    .result-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }

    .result-overlay.hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-card {
      background: var(--bg2);
      border-radius: 20px;
      padding: 32px 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      border: 2px solid var(--sep);
    }

    .result-card.success {
      border-color: var(--green);
      box-shadow: 0 0 30px rgba(102,187,106,0.2);
    }

    .result-card.fail {
      border-color: var(--red);
      box-shadow: 0 0 30px rgba(239,83,80,0.2);
    }

    .result-icon {
      font-size: 64px;
      animation: bounceIn 0.4s ease;
    }

    @keyframes bounceIn {
      0% { transform: scale(0); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
    }

    .result-detail {
      font-size: 13px;
      color: var(--fg2);
      line-height: 1.6;
    }

    .result-code {
      background: var(--bg3);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .btn-close {
      background: var(--mango2);
      color: #1A1A1A;
      border: none;
      padding: 12px 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
    }

    /* 扫码记录 */
    .history-section {
      width: 100%;
      max-width: 400px;
    }

    .history-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--fg2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-list {
      background: var(--bg2);
      border-radius: 12px;
      overflow: hidden;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--sep);
      gap: 10px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-icon {
      font-size: 20px;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-coupon {
      font-size: 13px;
      font-weight: 500;
    }

    .history-time {
      font-size: 11px;
      color: var(--fg2);
      margin-top: 2px;
    }

    .history-status {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 8px;
    }

    .history-status.valid {
      background: rgba(102,187,106,0.2);
      color: var(--green);
    }

    .history-status.invalid {
      background: rgba(239,83,80,0.2);
      color: var(--red);
    }

    .empty-history {
      text-align: center;
      padding: 24px;
      color: var(--fg2);
      font-size: 13px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 2000;
      pointer-events: none;
      animation: toastAnim 1.8s forwards;
    }

    @keyframes toastAnim {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* 权限提示 */
    .permission-tip {
      background: rgba(255,167,38,0.1);
      border: 1px solid rgba(255,167,38,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--mango);
      text-align: center;
      line-height: 1.5;
    }
  </style>
  <!-- CDN扫码库 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js">
  </script>
</head>
<body>
  <!-- 导航栏 -->
  <div class="nav">
    <button class="nav-back" onclick="window.open('index.html','_self')">← 首页</button>
    <div class="nav-title">📷 扫码核销</div>
    <div class="nav-status" id="navStatus">准备就绪</div>
  </div>

  <!-- 内容区 -->
  <div class="content">
    <!-- 商户信息 -->
    <div class="merchant-card">
      <div class="merchant-avatar">🏪</div>
      <div class="merchant-info">
        <div class="merchant-name">芒芒简餐商户端</div>
        <div class="merchant-id" id="merchantId">加载中...</div>
      </div>
      <div class="merchant-badge" id="merchantBadge">⏳ 验证中</div>
    </div>

    <!-- 扫码区域 -->
    <div class="scanner-wrapper">
      <div class="scanner-box" id="scannerBox">
        <video id="video" autoplay playsinline></video>
        <div class="scanner-placeholder" id="placeholder">
          <div class="placeholder-icon">📷</div>
          <div class="placeholder-text">将优惠券二维码对准框内</div>
          <div class="placeholder-hint">点击下方按钮开启摄像头</div>
        </div>
        <div class="scan-line" id="scanLine"></div>
      </div>

      <!-- 按钮 -->
      <div class="btn-row">
        <button class="btn btn-primary" id="btnStart">📷 开始扫码</button>
        <button class="btn btn-danger" id="btnStop" style="display:none;">⏹️ 停止</button>
      </div>

      <!-- 权限提示 -->
      <div class="permission-tip" id="permissionTip" style="display:none;">
        ⚠️ 请允许浏览器使用摄像头权限<br>扫码时请将二维码对准屏幕中央
      </div>
    </div>

    <!-- 扫码记录 -->
    <div class="history-section">
      <div class="history-title">📋 核销记录</div>
      <div class="history-list" id="historyList">
        <div class="empty-history">暂无核销记录</div>
      </div>
    </div>
  </div>

  <!-- 结果弹窗 -->
  <div class="result-overlay hidden" id="resultOverlay">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-code" id="resultCode"></div>
      <div class="result-detail" id="resultDetail"></div>
      <button class="btn-close" id="btnClose">确 定</button>
    </div>
  </div>

  <script>
    (function() {
      // ========== 配置 ==========
      const DB_URL = 'lib_memory.log';
      const COUP_KEY = 'mango_coupon_used';
      const HISTORY_KEY = 'mango_scan_history';
      const VALID_COUPON_CODE = 'MANGO_COUPON_2024_001';
      const VALID_COUPON_NAME = '芒芒新人券 · 满30减10';

      // ========== 状态 ==========
      let stream = null;
      let scanInterval = null;
      let merchantKey = null;
      let isScanning = false;

      // ========== DOM元素 ==========
      const video = document.getElementById('video');
      const placeholder = document.getElementById('placeholder');
      const scannerBox = document.getElementById('scannerBox');
      const scanLine = document.getElementById('scanLine');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const navStatus = document.getElementById('navStatus');
      const merchantId = document.getElementById('merchantId');
      const merchantBadge = document.getElementById('merchantBadge');
      const permissionTip = document.getElementById('permissionTip');
      const resultOverlay = document.getElementById('resultOverlay');
      const resultCard = document.getElementById('resultCard');
      const resultIcon = document.getElementById('resultIcon');
      const resultTitle = document.getElementById('resultTitle');
      const resultCode = document.getElementById('resultCode');
      const resultDetail = document.getElementById('resultDetail');
      const btnClose = document.getElementById('btnClose');
      const historyList = document.getElementById('historyList');

      // ========== 加载商户密钥 ==========
      async function loadMerchantKey() {
        try {
          const resp = await fetch(DB_URL);
          if (resp.ok) {
            const text = await resp.text();
            const data = JSON.parse(text);
            if (data.merchant_keys && data.merchant_keys.length > 0) {
              merchantKey = data.merchant_keys[0];
              merchantId.textContent = '密钥: ' + merchantKey.substring(0, 8) + '...';
              merchantBadge.textContent = '✅ 已认证';
              merchantBadge.className = 'merchant-badge';
              navStatus.textContent = '已认证';
              return true;
            }
          }
          setMerchantError('未找到密钥');
          return false;
        } catch (e) {
          setMerchantError('加载失败');
          return false;
        }
      }

      function setMerchantError(msg) {
        merchantId.textContent = msg;
        merchantBadge.textContent = '❌ ' + msg;
        merchantBadge.className = 'merchant-badge offline';
        navStatus.textContent = '未认证';
      }

      // ========== 摄像头操作 ==========
      async function startCamera() {
        // 检查浏览器支持
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          toast('您的浏览器不支持摄像头，请使用HTTPS访问');
          permissionTip.style.display = 'block';
          return;
        }

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
          video.srcObject = stream;
          video.style.display = 'block';
          placeholder.classList.add('hidden');
          scannerBox.classList.add('scanning');
          scanLine.style.display = 'block';
          btnStart.style.display = 'none';
          btnStop.style.display = 'flex';
          permissionTip.style.display = 'none';
          navStatus.textContent = '扫描中...';
          isScanning = true;
          startScanning();
        } catch (e) {
          console.error('摄像头错误:', e);
          permissionTip.style.display = 'block';
          if (e.name === 'NotAllowedError') {
            toast('请允许摄像头权限');
          } else if (e.name === 'NotFoundError') {
            toast('未检测到摄像头');
          } else {
            toast('摄像头启动失败');
          }
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        if (scanInterval) {
          clearInterval(scanInterval);
          scanInterval = null;
        }
        video.srcObject = null;
        video.style.display = 'none';
        placeholder.classList.remove('hidden');
        scannerBox.classList.remove('scanning');
        scanLine.style.display = 'none';
        btnStart.style.display = 'flex';
        btnStop.style.display = 'none';
        isScanning = false;
        navStatus.textContent = merchantKey ? '已认证' : '未认证';
      }

      // ========== 扫码检测 ==========
      function startScanning() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        scanInterval = setInterval(() => {
          if (!isScanning || video.readyState !== video.HAVE_ENOUGH_DATA) return;

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          if (canvas.width === 0 || canvas.height === 0) return;

          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          try {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, canvas.width, canvas.height, {
              inversionAttempts: 'dontInvert',
            });

            if (code && code.data) {
              handleScanResult(code.data);
            }
          } catch (e) {
            // 忽略单帧错误
          }
        }, 300);
      }

      // ========== 处理扫码结果 ==========
      function handleScanResult(data) {
        if (!isScanning) return;
        stopCamera();

        if (!merchantKey) {
          showResult('fail', '❌', '商户未认证', data, '请刷新页面后重试');
          addHistory(data, false);
          return;
        }

        if (data === VALID_COUPON_CODE) {
          // 检查是否已核销
          if (localStorage.getItem(COUP_KEY) === 'used') {
            showResult('fail', '⚠️', '优惠券已被核销', data, '该优惠券之前已经使用过了');
            addHistory(data, false);
          } else {
            // 核销优惠券
            localStorage.setItem(COUP_KEY, 'used');
            showResult('success', '🎉', '核销成功！', data, VALID_COUPON_NAME + '\n优惠券已标记为已使用');
            addHistory(data, true);
          }
        } else {
          showResult('fail', '❌', '无效优惠券', data, '扫描结果不是有效的优惠券码');
          addHistory(data, false);
        }
      }

      // ========== 显示结果弹窗 ==========
      function showResult(type, icon, title, code, detail) {
        resultCard.className = 'result-card ' + (type === 'success' ? 'success' : 'fail');
        resultIcon.textContent = icon;
        resultTitle.textContent = title;
        resultCode.textContent = code || '无数据';
        resultDetail.textContent = detail || '';
        resultOverlay.classList.remove('hidden');
      }

      function hideResult() {
        resultOverlay.classList.add('hidden');
      }

      // ========== 扫码记录 ==========
      function addHistory(code, success) {
        const history = getHistory();
        history.unshift({
          code: code || '未知',
          time: new Date().toLocaleString('zh-CN'),
          success: success
        });
        // 只保留最近20条
        if (history.length > 20) history.pop();
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderHistory();
      }

      function getHistory() {
        try {
          return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        } catch (e) {
          return [];
        }
      }

      function renderHistory() {
        const history = getHistory();
        if (history.length === 0) {
          historyList.innerHTML = '<div class="empty-history">暂无核销记录</div>';
          return;
        }
        historyList.innerHTML = history.map(item => `
          <div class="history-item">
            <div class="history-icon">${item.success ? '✅' : '❌'}</div>
            <div class="history-info">
              <div class="history-coupon">${item.code}</div>
              <div class="history-time">${item.time}</div>
            </div>
            <div class="history-status ${item.success ? 'valid' : 'invalid'}">
              ${item.success ? '核销成功' : '无效'}
            </div>
          </div>
        `).join('');
      }

      // ========== 事件绑定 ==========
      btnStart.addEventListener('click', startCamera);
      btnStop.addEventListener('click', stopCamera);
      btnClose.addEventListener('click', hideResult);
      resultOverlay.addEventListener('click', function(e) {
        if (e.target === resultOverlay) hideResult();
      });

      // ========== 工具函数 ==========
      function toast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
      }

      // ========== 监听优惠券状态变化 ==========
      window.addEventListener('storage', function(e) {
        if (e.key === COUP_KEY) {
          toast('⚠️ 优惠券状态已更新');
        }
      });

      // ========== 初始化 ==========
      async function init() {
        await loadMerchantKey();
        renderHistory();
        btnStart.disabled = !merchantKey;
        if (!merchantKey) {
          btnStart.textContent = '🔒 请先加载密钥';
        }
      }

      init();
    })();
  </script>
</body>
</html>
