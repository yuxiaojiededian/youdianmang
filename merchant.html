<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>芒芒简餐 · 商户扫码核销</title>
  <style>
    :root {
      --bg: #1A1A1A; --bg2: #222222; --bg3: #2C2C2C;
      --fg: rgba(255,255,255,0.9); --fg2: rgba(255,255,255,0.5);
      --mango: #FFA726; --mango2: #FF9800; --mango3: #F57C00;
      --green: #66BB6A; --red: #EF5350; --sep: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }
    .nav {
      background: var(--bg2); height: 44px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; border-bottom: 0.5px solid var(--sep); flex-shrink: 0;
    }
    .nav-back { background: none; border: none; color: var(--mango); font-size: 15px; cursor: pointer; padding: 6px 0; font-family: inherit; }
    .nav-title { font-size: 17px; font-weight: 500; }
    .nav-status { font-size: 11px; color: var(--fg2); }
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; gap: 16px; overflow-y: auto; }
    .merchant-card {
      background: var(--bg2); border-radius: 14px; padding: 16px 20px; width: 100%; max-width: 400px;
      display: flex; align-items: center; gap: 12px; border: 1px solid var(--sep);
    }
    .merchant-avatar {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--mango), var(--mango3));
      display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
    }
    .merchant-info { flex: 1; min-width: 0; }
    .merchant-name { font-size: 15px; font-weight: 600; }
    .merchant-id { font-size: 11px; color: var(--fg2); margin-top: 2px; }
    .merchant-badge {
      background: rgba(102,187,106,0.2); color: var(--green);
      padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .merchant-badge.offline { background: rgba(239,83,80,0.2); color: var(--red); }

    .scanner-box {
      width: 100%; max-width: 400px; aspect-ratio: 1; background: var(--bg2);
      border-radius: 16px; border: 2px solid var(--sep); overflow: hidden; position: relative;
    }
    .scanner-box.scanning { border-color: var(--mango); box-shadow: 0 0 20px rgba(255,167,38,0.2); }
    .scanner-box video { width: 100%; height: 100%; object-fit: cover; }
    .scanner-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--fg2); background: var(--bg2);
    }
    .scanner-placeholder.hidden { display: none; }
    .placeholder-icon { font-size: 56px; opacity: 0.6; }
    .placeholder-text { font-size: 14px; }
    .scan-line {
      position: absolute; top: 10%; left: 10%; width: 80%; height: 2px;
      background: var(--mango); box-shadow: 0 0 8px var(--mango);
      animation: scanLine 2s linear infinite; display: none;
    }
    .scanner-box.scanning .scan-line { display: block; }
    @keyframes scanLine { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }

    .btn-row { display: flex; gap: 12px; width: 100%; max-width: 400px; }
    .btn {
      flex: 1; padding: 16px 20px; border-radius: 12px; border: none; font-size: 16px;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--mango2); color: #1A1A1A; }
    .btn-primary:disabled { background: #444; color: #888; }
    .btn-danger { background: var(--red); color: white; }
    .btn-secondary { background: var(--bg2); color: var(--fg); border: 1.5px solid var(--sep); }

    .result-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .result-overlay.hidden { display: none; }
    .result-card {
      background: var(--bg2); border-radius: 20px; padding: 32px 24px;
      width: 90%; max-width: 360px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      border: 2px solid var(--sep);
    }
    .result-card.success { border-color: var(--green); }
    .result-card.fail { border-color: var(--red); }
    .result-icon { font-size: 64px; }
    .result-title { font-size: 20px; font-weight: 700; }
    .result-code {
      background: var(--bg3); padding: 8px 16px; border-radius: 8px;
      font-family: monospace; font-size: 12px; letter-spacing: 1px; word-break: break-all;
    }
    .result-detail { font-size: 13px; color: var(--fg2); line-height: 1.6; }
    .btn-close {
      background: var(--mango2); color: #1A1A1A; border: none;
      padding: 12px 32px; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit; margin-top: 8px;
    }

    .history-section { width: 100%; max-width: 400px; }
    .history-title { font-size: 14px; font-weight: 600; color: var(--fg2); margin-bottom: 10px; }
    .history-list { background: var(--bg2); border-radius: 12px; overflow: hidden; }
    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 0.5px solid var(--sep); gap: 10px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-icon { font-size: 20px; }
    .history-info { flex: 1; min-width: 0; }
    .history-coupon { font-size: 13px; font-weight: 500; }
    .history-time { font-size: 11px; color: var(--fg2); margin-top: 2px; }
    .history-status {
      font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 8px;
    }
    .history-status.valid { background: rgba(102,187,106,0.2); color: var(--green); }
    .history-status.invalid { background: rgba(239,83,80,0.2); color: var(--red); }
    .history-status.foreign { background: rgba(255,167,38,0.2); color: var(--mango); }
    .empty-history { text-align: center; padding: 24px; color: var(--fg2); font-size: 13px; }

    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 10px 22px; border-radius: 8px;
      font-size: 14px; z-index: 2000; pointer-events: none;
      animation: toastAnim 1.8s forwards;
    }
    @keyframes toastAnim {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      85% { opacity: 1; } 100% { opacity: 0; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js">
  </script>
</head>
<body>
  <div class="nav">
    <button class="nav-back" onclick="window.open('index.html','_self')">← 首页</button>
    <div class="nav-title">📷 扫码核销</div>
    <div class="nav-status" id="navStatus">准备就绪</div>
  </div>
  <div class="content">
    <div class="merchant-card">
      <div class="merchant-avatar">🏪</div>
      <div class="merchant-info">
        <div class="merchant-name">芒芒简餐商户端</div>
        <div class="merchant-id" id="merchantId">加载中...</div>
      </div>
      <div class="merchant-badge" id="merchantBadge">⏳ 验证中</div>
    </div>

    <div class="scanner-box" id="scannerBox">
      <video id="video" autoplay playsinline></video>
      <div class="scanner-placeholder" id="placeholder">
        <div class="placeholder-icon">📷</div>
        <div class="placeholder-text">点击下方按钮开启摄像头</div>
      </div>
      <div class="scan-line" id="scanLine"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnStart">📷 开始扫码</button>
      <button class="btn btn-danger" id="btnStop" style="display:none;">⏹️ 停止</button>
    </div>
    <button class="btn btn-secondary" id="btnTest" style="width:100%;max-width:400px;">🧪 模拟扫码测试</button>

    <div class="history-section">
      <div class="history-title">📋 核销记录</div>
      <div class="history-list" id="historyList">
        <div class="empty-history">暂无核销记录</div>
      </div>
    </div>
  </div>

  <div class="result-overlay hidden" id="resultOverlay">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-code" id="resultCode"></div>
      <div class="result-detail" id="resultDetail"></div>
      <button class="btn-close" id="btnClose">确 定</button>
    </div>
  </div>

  <script>
    (function() {
      const DB_URL = 'lib_memory.log';
      const COUP_KEY = 'mango_coupon_used';
      const HISTORY_KEY = 'mango_scan_history';
      const VALID_COUPON_CODE = 'MANGO_COUPON_2024_001';

      let stream = null;
      let scanInterval = null;
      let merchantKey = null;
      let isScanning = false;

      const video = document.getElementById('video');
      const placeholder = document.getElementById('placeholder');
      const scannerBox = document.getElementById('scannerBox');
      const scanLine = document.getElementById('scanLine');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const btnTest = document.getElementById('btnTest');
      const navStatus = document.getElementById('navStatus');
      const merchantId = document.getElementById('merchantId');
      const merchantBadge = document.getElementById('merchantBadge');
      const resultOverlay = document.getElementById('resultOverlay');
      const resultCard = document.getElementById('resultCard');
      const resultIcon = document.getElementById('resultIcon');
      const resultTitle = document.getElementById('resultTitle');
      const resultCode = document.getElementById('resultCode');
      const resultDetail = document.getElementById('resultDetail');
      const btnClose = document.getElementById('btnClose');
      const historyList = document.getElementById('historyList');

      // ============ 签名验证 ============
      function generateSignature(couponCode, timestamp, key) {
        const raw = couponCode + '|' + timestamp + '|' + key;
        return simpleHashHex(raw);
      }

      function simpleHashHex(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          const char = str.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        let hex = '';
        const seed = Math.abs(hash);
        for (let i = 0; i < 8; i++) {
          hex += ((seed >> (i * 4)) & 0xF).toString(16);
        }
        while (hex.length < 32) {
          hex += ((hash >> (hex.length % 8) * 4) & 0xF).toString(16);
        }
        return hex.substring(0, 32);
      }

      function verifySignedCoupon(data, key) {
        const parts = data.split('|');
        // 检查格式：code|timestamp|signature
        if (parts.length === 3) {
          const [code, timestamp, signature] = parts;
          const expectedSig = generateSignature(code, timestamp, key);
          if (signature === expectedSig) {
            return { valid: true, code: code, source: 'merchant' };
          }
          return { valid: false, code: code, source: 'merchant', reason: '签名不匹配' };
        }
        // 没有签名，可能是第三方扫码器
        if (parts.length === 1 && data === VALID_COUPON_CODE) {
          return { valid: false, code: data, source: 'third_party', reason: '第三方扫码器扫描，无签名验证' };
        }
        return { valid: false, code: data, source: 'unknown', reason: '格式错误' };
      }

      // ============ 加载商户密钥 ============
      async function loadMerchantKey() {
        try {
          const resp = await fetch(DB_URL);
          if (resp.ok) {
            const data = await resp.json();
            if (data.merchant_keys && data.merchant_keys.length > 0) {
              merchantKey = data.merchant_keys[0];
              merchantId.textContent = '密钥: ' + merchantKey.substring(0, 10) + '...';
              merchantBadge.textContent = '✅ 已认证';
              merchantBadge.className = 'merchant-badge';
              navStatus.textContent = '已认证';
              btnStart.disabled = false;
              btnStart.textContent = '📷 开始扫码';
              return true;
            }
          }
          setMerchantError('未找到密钥');
          return false;
        } catch (e) {
          setMerchantError('加载失败');
          return false;
        }
      }

      function setMerchantError(msg) {
        merchantId.textContent = msg;
        merchantBadge.textContent = '❌ ' + msg;
        merchantBadge.className = 'merchant-badge offline';
        navStatus.textContent = '未认证';
        btnStart.disabled = true;
        btnStart.textContent = '🔒 请先加载密钥';
      }

      // ============ 摄像头操作 ============
      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          toast('浏览器不支持摄像头，请使用HTTPS');
          return;
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = stream;
          video.style.display = 'block';
          placeholder.classList.add('hidden');
          scannerBox.classList.add('scanning');
          scanLine.style.display = 'block';
          btnStart.style.display = 'none';
          btnStop.style.display = 'flex';
          btnTest.style.display = 'none';
          navStatus.textContent = '扫描中...';
          isScanning = true;
          startScanning();
        } catch (e) {
          if (e.name === 'NotAllowedError') toast('请允许摄像头权限');
          else if (e.name === 'NotFoundError') toast('未检测到摄像头');
          else toast('摄像头启动失败');
        }
      }

      function stopCamera() {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        video.srcObject = null;
        video.style.display = 'none';
        placeholder.classList.remove('hidden');
        scannerBox.classList.remove('scanning');
        scanLine.style.display = 'none';
        btnStart.style.display = 'flex';
        btnStop.style.display = 'none';
        btnTest.style.display = 'block';
        isScanning = false;
        navStatus.textContent = merchantKey ? '已认证' : '未认证';
      }

      function startScanning() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        scanInterval = setInterval(() => {
          if (!isScanning || video.readyState !== video.HAVE_ENOUGH_DATA) return;
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          if (canvas.width === 0 || canvas.height === 0) return;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          try {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
            if (code && code.data) { handleScanResult(code.data); }
          } catch (e) {}
        }, 300);
      }

      // ============ 处理扫码结果 ============
      function handleScanResult(data) {
        if (!isScanning) return;
        stopCamera();

        if (!merchantKey) {
          showResult('fail', '❌', '商户未认证', data, '请刷新页面重试');
          addHistory(data, 'invalid', '未认证');
          return;
        }

        const result = verifySignedCoupon(data, merchantKey);

        if (result.valid && result.source === 'merchant') {
          if (localStorage.getItem(COUP_KEY) === 'used') {
            showResult('fail', '⚠️', '优惠券已被核销', result.code, '该券之前已使用，无法重复核销');
            addHistory(result.code, 'invalid', '已核销过');
          } else {
            localStorage.setItem(COUP_KEY, 'used');
            showResult('success', '🎉', '核销成功！', result.code, '芒芒新人券 · 满30减10\n✅ 已标记为已使用');
            addHistory(result.code, 'valid', '商户端核销');
          }
        } else if (result.source === 'third_party') {
          showResult('fail', '📱', '第三方扫码器无效', result.code, '检测到使用微信/支付宝等第三方扫码器\n此优惠券仅限商户端扫码核销\n请使用芒芒简餐商户端扫描');
          addHistory(result.code, 'foreign', '第三方扫码器');
        } else {
          showResult('fail', '❌', '验证失败', data, result.reason || '二维码无效');
          addHistory(data, 'invalid', result.reason || '无效');
        }
      }

      // ============ 测试功能 ============
      function simulateScan() {
        if (!merchantKey) { toast('请先加载商户密钥'); return; }
        const timestamp = Date.now();
        const signature = generateSignature(VALID_COUPON_CODE, timestamp, merchantKey);
        const testData = VALID_COUPON_CODE + '|' + timestamp + '|' + signature;
        handleScanResult(testData);
      }

      // ============ 结果显示 ============
      function showResult(type, icon, title, code, detail) {
        resultCard.className = 'result-card ' + (type === 'success' ? 'success' : 'fail');
        resultIcon.textContent = icon;
        resultTitle.textContent = title;
        resultCode.textContent = code || '无数据';
        resultDetail.textContent = detail || '';
        resultOverlay.classList.remove('hidden');
      }

      function hideResult() { resultOverlay.classList.add('hidden'); }

      // ============ 历史记录 ============
      function addHistory(code, status, reason) {
        const history = getHistory();
        history.unshift({
          code: code || '未知',
          time: new Date().toLocaleString('zh-CN'),
          status: status,
          reason: reason || ''
        });
        if (history.length > 30) history.pop();
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderHistory();
      }

      function getHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
        catch (e) { return []; }
      }

      function renderHistory() {
        const history = getHistory();
        if (history.length === 0) {
          historyList.innerHTML = '<div class="empty-history">暂无核销记录</div>';
          return;
        }
        historyList.innerHTML = history.map(item => {
          const statusClass = item.status === 'valid' ? 'valid' : (item.status === 'foreign' ? 'foreign' : 'invalid');
          const statusText = item.status === 'valid' ? '✅ 核销成功' : (item.status === 'foreign' ? '📱 第三方' : '❌ 无效');
          const icon = item.status === 'valid' ? '✅' : (item.status === 'foreign' ? '📱' : '❌');
          return `<div class="history-item">
            <div class="history-icon">${icon}</div>
            <div class="history-info">
              <div class="history-coupon">${item.code}</div>
              <div class="history-time">${item.time} · ${item.reason}</div>
            </div>
            <div class="history-status ${statusClass}">${statusText}</div>
          </div>`;
        }).join('');
      }

      // ============ 事件绑定 ============
      btnStart.addEventListener('click', startCamera);
      btnStop.addEventListener('click', stopCamera);
      btnTest.addEventListener('click', simulateScan);
      btnClose.addEventListener('click', hideResult);
      resultOverlay.addEventListener('click', (e) => { if (e.target === resultOverlay) hideResult(); });

      function toast(m) {
        const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
        document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
      }

      window.addEventListener('storage', (e) => {
        if (e.key === COUP_KEY) toast('⚠️ 优惠券状态已更新');
      });

      // ============ 初始化 ============
      async function init() {
        await loadMerchantKey();
        renderHistory();
      }
      init();
    })();
  </script>
</body>
</html>
