<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>芒芒简餐 · 商户扫码</title>
  <style>
    :root {
      --bg: #1A1A1A; --bg2: #222222; --bg3: #2C2C2C;
      --fg: rgba(255,255,255,0.9); --fg2: rgba(255,255,255,0.5);
      --mango: #FFA726; --mango2: #FF9800; --green: #66BB6A; --red: #EF5350;
      --sep: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column;
    }
    .nav {
      background: var(--bg2); height: 44px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; border-bottom: 0.5px solid var(--sep);
    }
    .nav-back { background: none; border: none; color: var(--mango); font-size: 15px; cursor: pointer; font-family: inherit; }
    .nav-title { font-size: 17px; font-weight: 500; }
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; gap: 16px; overflow-y: auto; }
    .scanner-box {
      width: 100%; max-width: 400px; aspect-ratio: 1; background: var(--bg2);
      border-radius: 16px; border: 2px solid var(--sep); overflow: hidden; position: relative;
    }
    .scanner-box.scanning { border-color: var(--mango); }
    .scanner-box video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--fg2); background: var(--bg2); gap: 12px;
    }
    .placeholder.hidden { display: none; }
    .placeholder-icon { font-size: 56px; }
    .scan-line {
      position: absolute; top: 10%; left: 10%; width: 80%; height: 2px;
      background: var(--mango); display: none;
      animation: scan 2s linear infinite;
    }
    .scanner-box.scanning .scan-line { display: block; }
    @keyframes scan { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
    .btn-row { display: flex; gap: 12px; width: 100%; max-width: 400px; }
    .btn {
      flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 16px;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: var(--mango2); color: #1A1A1A; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-test { background: var(--bg2); color: var(--fg); border: 1.5px solid var(--sep); width: 100%; max-width: 400px; }
    .result-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .result-overlay.hidden { display: none; }
    .result-card {
      background: var(--bg2); border-radius: 20px; padding: 32px 24px;
      width: 90%; max-width: 360px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .result-card.success { border: 2px solid var(--green); }
    .result-card.fail { border: 2px solid var(--red); }
    .result-icon { font-size: 64px; }
    .result-title { font-size: 20px; font-weight: 700; }
    .result-detail { font-size: 13px; color: var(--fg2); }
    .btn-close {
      background: var(--mango2); color: #1A1A1A; border: none;
      padding: 12px 32px; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .history-section { width: 100%; max-width: 400px; }
    .history-title { font-size: 14px; font-weight: 600; color: var(--fg2); margin-bottom: 10px; }
    .history-list { background: var(--bg2); border-radius: 12px; overflow: hidden; }
    .history-item {
      display: flex; align-items: center; padding: 12px 16px;
      border-bottom: 0.5px solid var(--sep); gap: 10px; font-size: 13px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-status { font-size: 11px; padding: 3px 8px; border-radius: 6px; }
    .history-status.ok { background: rgba(102,187,106,0.2); color: var(--green); }
    .history-status.no { background: rgba(239,83,80,0.2); color: var(--red); }
    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 10px 22px; border-radius: 8px;
      font-size: 14px; z-index: 2000; pointer-events: none;
      animation: t 1.8s forwards;
    }
    @keyframes t { 0%{opacity:0;transform:translate(-50%,-50%)scale(0.8)} 15%{opacity:1;transform:translate(-50%,-50%)scale(1)} 85%{opacity:1} 100%{opacity:0} }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="nav">
    <button class="nav-back" onclick="window.open('index.html','_self')">← 首页</button>
    <div class="nav-title">📷 扫码核销</div>
    <div style="width:40px;"></div>
  </div>
  <div class="content">
    <div class="scanner-box" id="scannerBox">
      <video id="video" autoplay playsinline></video>
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">📷</div>
        <div>点击下方按钮开启摄像头</div>
      </div>
      <div class="scan-line"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnStart">📷 开始扫码</button>
      <button class="btn btn-danger" id="btnStop" style="display:none;">⏹️ 停止</button>
    </div>
    <button class="btn btn-test" id="btnTest">🧪 模拟扫码测试</button>
    <div class="history-section">
      <div class="history-title">📋 核销记录</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
  <div class="result-overlay hidden" id="resultOverlay">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
      <button class="btn-close" id="btnClose">确定</button>
    </div>
  </div>

  <script>
    (function() {
      const COUP_KEY = 'mango_coupon_used';
      const HISTORY_KEY = 'mango_scan_history';
      const VALID_CODE = 'MANGO_COUPON_2024_001';
      let stream = null, scanInterval = null, isScanning = false;

      const video = document.getElementById('video');
      const placeholder = document.getElementById('placeholder');
      const scannerBox = document.getElementById('scannerBox');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const btnTest = document.getElementById('btnTest');
      const resultOverlay = document.getElementById('resultOverlay');
      const resultCard = document.getElementById('resultCard');
      const resultIcon = document.getElementById('resultIcon');
      const resultTitle = document.getElementById('resultTitle');
      const resultDetail = document.getElementById('resultDetail');
      const btnClose = document.getElementById('btnClose');
      const historyList = document.getElementById('historyList');

      async function startCamera() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          video.srcObject = stream;
          video.style.display = 'block';
          placeholder.classList.add('hidden');
          scannerBox.classList.add('scanning');
          btnStart.style.display = 'none';
          btnStop.style.display = 'flex';
          isScanning = true;
          scanLoop();
        } catch(e) {
          toast('无法访问摄像头: ' + e.message);
        }
      }

      function stopCamera() {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        video.style.display = 'none';
        placeholder.classList.remove('hidden');
        scannerBox.classList.remove('scanning');
        btnStart.style.display = 'flex';
        btnStop.style.display = 'none';
        isScanning = false;
      }

      function scanLoop() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        scanInterval = setInterval(() => {
          if (!isScanning || video.readyState < 2) return;
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          if (!canvas.width) return;
          ctx.drawImage(video, 0, 0);
          try {
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(data.data, canvas.width, canvas.height);
            if (code && code.data) handleResult(code.data);
          } catch(e) {}
        }, 400);
      }

      function handleResult(data) {
        stopCamera();
        if (data === VALID_CODE) {
          if (localStorage.getItem(COUP_KEY) === 'used') {
            showResult('fail', '⚠️', '优惠券已被核销', '该券之前已使用');
            addHistory(data, false);
          } else {
            localStorage.setItem(COUP_KEY, 'used');
            showResult('success', '🎉', '核销成功！', '芒芒新人券已使用');
            addHistory(data, true);
          }
        } else {
          showResult('fail', '❌', '无效优惠券', '扫描结果: ' + data);
          addHistory(data, false);
        }
      }

      function showResult(type, icon, title, detail) {
        resultCard.className = 'result-card ' + (type === 'success' ? 'success' : 'fail');
        resultIcon.textContent = icon;
        resultTitle.textContent = title;
        resultDetail.textContent = detail;
        resultOverlay.classList.remove('hidden');
      }

      function hideResult() { resultOverlay.classList.add('hidden'); }

      function addHistory(code, ok) {
        const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        h.unshift({ code, time: new Date().toLocaleString(), ok });
        if (h.length > 20) h.pop();
        localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
        renderHistory();
      }

      function renderHistory() {
        const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        historyList.innerHTML = h.length === 0
          ? '<div style="text-align:center;padding:20px;color:var(--fg2);">暂无记录</div>'
          : h.map(i => `<div class="history-item"><span>${i.ok?'✅':'❌'}</span><span style="flex:1;">${i.code}</span><span style="font-size:11px;color:var(--fg2);">${i.time}</span><span class="history-status ${i.ok?'ok':'no'}">${i.ok?'成功':'无效'}</span></div>`).join('');
      }

      btnStart.addEventListener('click', startCamera);
      btnStop.addEventListener('click', stopCamera);
      btnTest.addEventListener('click', () => handleResult(VALID_CODE));
      btnClose.addEventListener('click', hideResult);
      resultOverlay.addEventListener('click', e => { if (e.target === resultOverlay) hideResult(); });

      function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
      renderHistory();
    })();
  </script>
</body>
</html>
