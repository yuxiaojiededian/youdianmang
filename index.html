<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>芒芒简餐 · 首页</title>
  <style>
    :root {
      --bg: #1A1A1A;
      --bg2: #222222;
      --bg3: #2C2C2C;
      --fg: rgba(255,255,255,0.9);
      --fg2: rgba(255,255,255,0.5);
      --mango: #FFA726;
      --mango2: #FF9800;
      --mango3: #F57C00;
      --cream: #FFF8E1;
      --sep: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      align-items: center;
    }

    .logo-area {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      font-size: 80px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .logo-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--mango);
      letter-spacing: 3px;
    }

    .logo-sub {
      font-size: 14px;
      color: var(--fg2);
      letter-spacing: 2px;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: var(--mango);
      border-radius: 2px;
    }

    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-client {
      background: linear-gradient(135deg, var(--mango), var(--mango3));
      color: #1A1A1A;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(255, 167, 38, 0.3);
    }

    .btn-client:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(255, 167, 38, 0.2);
    }

    .btn-admin {
      background: var(--bg2);
      color: var(--fg);
      border: 1.5px solid var(--sep);
    }

    .btn-admin:active {
      background: var(--bg3);
    }

    .btn-icon {
      font-size: 28px;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-label {
      font-size: 17px;
    }

    .btn-desc {
      font-size: 12px;
      opacity: 0.7;
    }

    .footer {
      text-align: center;
      color: var(--fg2);
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-icon">🥭</div>
      <div class="logo-title">芒芒简餐</div>
      <div class="divider"></div>
      <div class="logo-sub">MANGO DESSERT · 芒果甜品简餐</div>
    </div>

    <!-- 按钮 -->
    <div class="btn-group">
      <a href="client.html" class="btn btn-client">
        <span class="btn-icon">🍽️</span>
        <span class="btn-text">
          <span class="btn-label">进入点餐</span>
          <span class="btn-desc">浏览菜单 · 在线下单</span>
        </span>
      </a>

      <a href="admin.html" class="btn btn-admin">
        <span class="btn-icon">⚙️</span>
        <span class="btn-text">
          <span class="btn-label">后台管理</span>
          <span class="btn-desc">菜单管理 · 订单处理</span>
        </span>
      </a>
    </div>

    <!-- 特色提示 -->
    <div class="footer">
      🥭 新鲜芒果 · 当日制作 · 甜蜜直达 🥭
    </div>
  </div>
</body>
</html>
