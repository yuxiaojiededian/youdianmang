<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>芒芒简餐 · 四季甜品</title>
  <style>
    :root {
      --bg: #1A1A1A; --bg2: #222222; --bg3: #2C2C2C;
      --fg: rgba(255,255,255,0.9); --fg2: rgba(255,255,255,0.5);
      --mango: #FFA726; --mango2: #FF9800; --sep: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--fg); min-height: 100vh;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
    .logo-area { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .logo-img {
      width: 100px; height: 100px; border-radius: 24px;
      background: linear-gradient(135deg, #FFA726, #F57C00);
      display: flex; align-items: center; justify-content: center; font-size: 56px;
      box-shadow: 0 8px 30px rgba(255,167,38,0.3); animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .logo-title { font-size: 30px; font-weight: 700; color: var(--mango); letter-spacing: 3px; }
    .logo-sub { font-size: 13px; color: var(--fg2); letter-spacing: 2px; }
    .season-tag { background: rgba(255,167,38,0.15); color: var(--mango); padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .features { display: flex; gap: 12px; width: 100%; }
    .feature { flex: 1; background: var(--bg2); border-radius: 12px; padding: 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .feature-icon { font-size: 28px; }
    .feature-title { font-size: 13px; font-weight: 600; }
    .feature-desc { font-size: 11px; color: var(--fg2); }
    .btn-group { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-radius: 14px;
      border: none; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 500;
      transition: all 0.2s; text-decoration: none; color: var(--fg);
    }
    .btn-client { background: linear-gradient(135deg, #FFA726, #F57C00); color: #1A1A1A; font-weight: 700; font-size: 18px; box-shadow: 0 6px 24px rgba(255,167,38,0.35); }
    .btn-client:active { transform: scale(0.97); }
    .btn-admin, .btn-merchant { background: var(--bg2); border: 1.5px solid var(--sep); }
    .btn-merchant .btn-label { color: var(--mango); }
    .btn-admin:active, .btn-merchant:active { background: var(--bg3); }
    .btn-icon { font-size: 28px; }
    .btn-text { display: flex; flex-direction: column; gap: 3px; }
    .btn-label { font-size: 16px; font-weight: 600; }
    .btn-desc { font-size: 12px; opacity: 0.7; }
    .footer { text-align: center; color: var(--fg2); font-size: 11px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <div class="logo-img">🥭</div>
      <div class="logo-title">芒芒简餐</div>
      <div class="logo-sub">MANGO DESSERT · 四季甜品</div>
      <div class="season-tag" id="seasonTag">☀️ 夏季清凉特供</div>
    </div>
    <div class="features">
      <div class="feature"><div class="feature-icon">🥭</div><div class="feature-title">新鲜芒果</div><div class="feature-desc">当日采购</div></div>
      <div class="feature"><div class="feature-icon">🎫</div><div class="feature-title">优惠券</div><div class="feature-desc">扫码核销</div></div>
      <div class="feature"><div class="feature-icon">🛵</div><div class="feature-title">快速送达</div><div class="feature-desc">30分钟达</div></div>
    </div>
    <div class="btn-group">
      <a href="client.html" class="btn btn-client">
        <span class="btn-icon">🍽️</span>
        <span class="btn-text"><span class="btn-label">开始点餐</span><span class="btn-desc">浏览菜单 · 在线下单</span></span>
      </a>
      <a href="merchant.html" class="btn btn-merchant">
        <span class="btn-icon">📷</span>
        <span class="btn-text"><span class="btn-label">商户扫码</span><span class="btn-desc">摄像头扫码 · 核销优惠券</span></span>
      </a>
      <a href="admin.html" class="btn btn-admin">
        <span class="btn-icon">⚙️</span>
        <span class="btn-text"><span class="btn-label">后台管理</span><span class="btn-desc">菜单管理 · 自动同步</span></span>
      </a>
    </div>
    <div class="footer">🥭 芒芒简餐 · 甜蜜四季 · 新鲜直达 🥭</div>
  </div>
  <script>
    (function() {
      const m = new Date().getMonth() + 1;
      const tag = document.getElementById('seasonTag');
      if (m >= 5 && m <= 9) tag.textContent = '☀️ 夏季清凉特供 · 芒果沙冰季';
      else if (m >= 11 || m <= 2) tag.textContent = '❄️ 冬季暖心热饮 · 温暖甜品';
      else tag.textContent = '🌸 春秋限定 · 四季甜品';
    })();
  </script>
</body>
</html>
